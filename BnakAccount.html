<!DOCTYPE html>
<html>
<head>
    <title>Product Management</title>

    <script>

        // User-defined object using class
        class Product {

            constructor(productId, productName, price, quantity) {
                this.productId = productId;
                this.productName = productName;
                this.price = price;
                this.quantity = quantity;
            }

            // Calculate total price
            totalPrice() {
                return this.price * this.quantity;
            }

            // Update quantity
            updateQuantity(newQuantity) {
                this.quantity = newQuantity;
            }

            // Display product information
            display() {
                console.log("Product ID:", this.productId);
                console.log("Product Name:", this.productName);
                console.log("Price:", this.price);
                console.log("Quantity:", this.quantity);
                console.log("Total Price:", this.totalPrice());
            }
        }


        // Taking input from user
        let productId = Number(prompt("Enter Product ID:"));
        let productName = prompt("Enter Product Name:");
        let price = Number(prompt("Enter Price:"));
        let quantity = Number(prompt("Enter Quantity:"));


        // Create object
        let p1 = new Product(productId, productName, price, quantity);


        // Display original details
        console.log("Product Details:");
        p1.display();


        // Update quantity
        let newQuantity = Number(prompt("Enter new quantity:"));

        p1.updateQuantity(newQuantity);


        // Display updated details
        console.log("After updating quantity:");

        p1.display();

    </script>
</head>

<body>

    <h2>Product Management</h2>

    <p>Open the browser console using <b>F12 → Console</b> to see the output.</p>

</body>
</html>
<body>

</html> -->
