<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Template</title>

    <script>

        // STRING TEMPLATE

        let firstName = "abhay";
        let lastName = " kumar";

        console.log(`My first Name is ${firstName}`);
        console.log(`My name is: ${firstName}${lastName}`);
        console.log(`My name is: ${firstName}${lastName}`);


        // NORMAL FUNCTION

        function FullName(first, last) {
            return `${first}${last}`;
        }

        let Name = `Hello ${FullName(firstName, lastName)}`;
        console.log(Name);


        // NORMAL FUNCTION

        function hello() {
            console.log("hello world");
        }


        // FUNCTION EXPRESSION

        let hello2 = function () {
            console.log("hello world");
        }


        // ARROW FUNCTION

        const hello3 = () => console.log("hello world");


        // ARROW FUNCTION WITH BODY

        const hello4 = () => {
            console.log("hello world");
        }


        // ARROW FUNCTION WITH PARAMETER

        let marks = 5;

        function physics(marks) {
            return `${marks}`;
        }

        const physics2 = (marks) => `${marks}`;


        // ARROW FUNCTION FOR FULL NAME

        const FullName2 = (First, Last) => `${First}${Last}`;


        // PATTERN

        let n = Number(prompt("Enter no. of rows"));

        const pattern = (n) => {

            for (let i = 0; i < n; i++) {

                let row = "";

                for (let j = 0; j <= i; j++) {
                    row += "*";
                }

                console.log(row);
            }

        };

        pattern(n);

        function sum(name,first,...values){
            let total=0;
            for(let n of values){
                total=total+n;
            }
            return total;
        }

        console.log(sum(10,20,30,57,34,678896,54));

    </script>
</head>
