    <title>Inheritance in JavaScript</title>
</head>
<body>

<script>
    class Hello {
        constructor() {
            console.log("Hello constructor");
        }
    }

    class Hi extends Hello {
        constructor() {
            super();
            console.log("Hi constructor");
        }
    }

    let obj = new Hi();
    class info{
        info1(){
            console.log("infohello")
        }
    }
    class hi extends Hello(){
        info(){
            super info1();
            console.log("infohi");
        }
    }
    let h1=new Hi();
    hi.info();
</script>

</body>
</html>
