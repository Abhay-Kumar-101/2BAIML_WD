<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance in JavaScript</title>
</head>
<body>

<script>

    // Parent class
    class Hello {
        constructor() {
            console.log("Hello constructor");
        }
    }

    // Child class
    class Hi extends Hello {
        constructor() {
            super();
            console.log("Hi constructor");
        }
    }

    // Object of Hi
    let obj = new Hi();


    // Parent class
    class Info {
        info1() {
            console.log("infohello");
        }
    }

    // Child class
    class HiInfo extends Info {
        info() {
            super.info1();
            console.log("infohi");
        }
    }

    // Object of HiInfo
    let h1 = new HiInfo();

    h1.info();

</script>

</body>
</html>
