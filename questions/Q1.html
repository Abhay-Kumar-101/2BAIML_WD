    <script>
        class student {
            static count = 0;
            constructor(name,roll,marks){
                this.name=name;
                this.marks=marks;;
                this.roll=roll;
                student.count++;

            }
            display(){
                console.log(this.name)
                console.log(this .roll)
                console.log(this.marks);
                if (this.marks>=35){
                    console.log("Pass")
                }
                else{
                    console.log("Fail");
                }
            }
        }
        let s1 = new student ("abhay",2,45);
        let s2 = new student ("archit",1,4);
        let s3 = new student ("arun",23,78);
        s1.display();
        s2.display();
        s3.display();
        console.log(student.count);

    </script>
