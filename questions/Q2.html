<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        class BankAccount {
            constructor(accountNo, holderName, balance) {
                this.accountNo = accountNo;
                this.holderName = holderName;
                this.balance = balance;

            }
            deposit(amount) {
                this.balance += amount;
                console.log("Amount added =", amount, "-> Amount Deposited")
                console.log("Total Amount is", this.balance)
            }
            withdraw(amount) {
                if (amount > this.balance) {
                    console.log("Insuffcient balance ")
                }
            }
            displayBalance() {
                console.log("AccountID :", this.accountNo)
                console.log("Account Holder :", this.holderName)
                console.log("Balance :", this.balance);
            }
            static Bankinfo() {
                console.log("Bank Name: SBI")
            }
        }
        let s1 = new BankAccount(1, "abhay", 45);
        let s2 = new BankAccount(2, "archit", 4);


        s1.displayBalance();
        s1.deposit(59);
        s1.displayBalance();
        s1.withdraw(200);
        s2.displayBalance();
        s2.deposit(1000);
        s2.displayBalance();
        s2.withdraw(200);

        BankAccount.Bankinfo()

    </script>

</body>

</html>
